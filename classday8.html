<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
</head>
<body>
    <script type="text/javascript">
        let count=0;
        while(count<5){
             let code=parseInt(prompt("Enter product code (1-3):"));
             let qty=parseInt(prompt("Enter quantity:"));
        if(code<1||code>3){
            console.log("Invalid product code skip..");
            continue;
        }
        let price=0;
        let product="";
        switch(code){
            case 1:
                product="Apple";
                price=30*qty;
                break;
            case 2:
                product="Banana";
                price=10*qty;
                break;
            case 3:
                product="Mango";
                price=50*qty ;
                break;       
        }
        console.log("Product:"+product);
        console.log("Price:"+price);
        console.log("Total Price:"+price)
        if(price>100){
            console.log("High Purchase");
        }else{
            console.log("Normal Purchase");
        }

        }
        
        


    </script>
    
</body>
</html>
