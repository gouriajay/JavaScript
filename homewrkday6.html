<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result Dashboard</title>
   </head>
<body>
     <script language="javascript" type="text/javascript">
        var students=[
        {name:"Dhanya",score:72},
        {name:"Anju",score:45},
        {name:"Kanmani",score:95},
        {name:"Divya",score:30},
        {name:"kavya,",score:88},
        ];
        var students1=students.map(s =>s.name);
        console.log("All Students Name:",students1);
        var score60=students.filter(s=>s.score>60).map(s=>s.name);
        console.log("Scored Above 60:",score60);
        var totalscore=students.reduce((sum,s)=>sum+s.score,0);
        console.log("Total Score:",totalscore);
        var allpassed=students.every(s=>s.score>35);
        console.log("All Students Passed:",allpassed);
        var oneabove90=students.some(s=>s.score>90);
        console.log("One Student More than 90:",oneabove90);
        var sortedstudent=students.sort((a,b)=>b.score-a.score);
        console.log("Sorted Score (Desc):");
        sortedstudent.forEach(s=>console.log(s.name, "-",s.score));




        


     </script>
