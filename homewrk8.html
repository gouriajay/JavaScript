<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input System</title>
</head>
<body>
    <script type="text/javascript">
        let chance=0
        while(chance<5){
            let num=parseInt(prompt("Enter a number between 1 and 5:"));
            if(num<1||num>5){
                console.log("Invalid input and skip...:");
                continue;
            }
            if(num==3){
                console.log("You guessed it right!");
            }else{
                console.log("Wrong guess.Try again.");
            }
            switch(num){
                case 1:
                    console.log("You Entered:One");
                    break;
                case 2:
                    console.log("You Entered:Two");
                    break;
                case 3:
                    console.log("You Entered:Three");
                    break;
                case 4:
                    console.log("you Entered:Four") ;
                    break;
                case 5:
                    console.log("You Entered:Five");
                    break;       
            }
            if(num==5){
                console.log("Game Over");
            }
            chance++;
        }



        
    



    </script>
    
</body>
</html>
